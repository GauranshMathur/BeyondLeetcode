# BeyondLeetcode, written by `docker run <image> init`. Settings come from the .env next to this file.
# Start: docker compose up -d. Stop: docker compose down (add -v to delete the database volume too).
#
# Until the Runner pulls its own sandbox image (card C4d), pull it once on this machine:
#   docker pull python:3.13-slim

services:
  web:
    image: ${BEYONDLEETCODE_IMAGE}
    command: web
    ports:
      - "${PORT}:3000"
    environment:
      # The public URL of this Instance, e.g. https://learn.example.com. ORIGIN is required for Multi-user:
      # Setup will not offer it without ORIGIN, and a Multi-user Instance will not start without it.
      # Local mode behind a reverse proxy can do without it: delete the ORIGIN line from .env (an empty
      # ORIGIN= stops the server) and uncomment these two lines instead (the proxy must send them):
      ORIGIN:
      # PROTOCOL_HEADER: x-forwarded-proto
      # HOST_HEADER: x-forwarded-host
      # Behind a reverse proxy, also set these two in .env so the app sees each client's own address.
      # Without them every client looks like the proxy and they all share one sign-in rate limit.
      # ADDRESS_HEADER names the header your proxy fills in with the client address (X-Forwarded-For);
      # XFF_DEPTH counts the proxies that append to it (1 for a single proxy). Leave both unset
      # when clients reach this container directly.
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      XFF_DEPTH: ${XFF_DEPTH:-1}
      RUNNER_URL: http://runner:8787
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      # Multi-user only, all optional: Local mode starts without them.
      # Never add BETTER_AUTH_SECRETS or BETTER_AUTH_TRUSTED_ORIGINS here: the app refuses to start with either set.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - data:/data
    depends_on:
      - runner
    restart: unless-stopped
    networks: [default, internal]

  runner:
    image: ${BEYONDLEETCODE_IMAGE}
    command: runner
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
    volumes:
      # The only container with the engine socket. It runs learner code in sandboxes.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks: [internal]

networks:
  # No route out: the Docker daemon, not this container, pulls the sandbox image.
  internal:
    internal: true

volumes:
  data:
