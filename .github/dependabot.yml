version: 2
updates:
  # Bun: one grouped monthly version-update PR for minor and patch updates. Majors are
  # ignored here because each major gets its own card (like C67). The ecosystem must be
  # "bun" because the repo has bun.lock and no npm/yarn/pnpm lockfile.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      bun-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: monthly version updates (third-party actions are pinned by full SHA with a version comment, so Dependabot moves ci.yml and release.yml together; actions/* stay on tags).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # No docker entry: every Dockerfile builds its FROM line from an ARG.
