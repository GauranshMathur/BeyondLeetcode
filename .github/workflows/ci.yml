name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The browser jobs (e2e, docker) run their Playwright step in this image, which ships Chromium and its system
  # libraries, so CI never calls apt (its Azure mirror ran at 25 kB/s on 2026-10-26; C91). Multi-arch index digest
  # of mcr.microsoft.com/playwright:v1.64.1-noble. Keep the version equal to @playwright/test in bun.lock: the
  # "Check the Playwright image" step fails with the line to change when they differ.
  # To bump: `docker buildx imagetools inspect mcr.microsoft.com/playwright:v<version>-noble`, copy its top-level
  # "Digest:" (the index, not a per-platform manifest), and change the tag and digest here with the bun bump.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Check third-party actions are pinned by SHA
        # Outside actions/*, every action in the workflows needs a 40-hex ref, so a moved tag cannot reach a job
        # that holds a credential. The restricted syntax it accepts is in check-pins.sh.
        run: .github/check-pins.sh
      - name: Test the pin check
        run: .github/pins.test.sh
      - name: Test the published-tag check
        run: .github/published.test.sh
      - name: Test the release gate's wait for ci
        run: .github/ci-gate.test.sh

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run test
      # vitest runs under Node; the engine's timeouts must also hold on the pinned Bun (#284).
      - run: bun run test:bun

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Builds run on 1.4.3, not the production 1.2.19: SvelteKit 3's build workers end with process.exit(), which
          # on Bun before 1.3.13 ends the whole build early with exit 0 and no build/. Keep equal to the Dockerfile's
          # BUILD_BUN_VERSION and to the e2e job.
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Fails loudly if a build ever stops early with exit 0 again.
      - run: test -f build/index.js && test -f build/handler.js

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # playwright.config.ts runs `bun run build` here and serves the tests from it, so this job needs the build Bun
          # (see the build job); keep equal to the Dockerfile's BUILD_BUN_VERSION.
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Check the Playwright image
        run: |
          version="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("node_modules/@playwright/test/package.json", "utf8")).version)')"
          case "$PLAYWRIGHT_IMAGE" in
            *":v$version-"*) echo "Playwright $version matches $PLAYWRIGHT_IMAGE" ;;
            *)
              echo "::error::@playwright/test is $version (bun.lock) but PLAYWRIGHT_IMAGE in .github/workflows/ci.yml is $PLAYWRIGHT_IMAGE. Set it to mcr.microsoft.com/playwright:v$version-noble@sha256:<index digest from 'docker buildx imagetools inspect mcr.microsoft.com/playwright:v$version-noble'>."
              exit 1 ;;
          esac
      # Run goes through the real Runner (started by the Playwright config), which needs the Sandbox image.
      - run: docker pull python:3.13-slim
      # Built here under the exact name:tag config.ts uses, so the Runner finds it locally and never waits
      # on a pull of a tag that is only published once this change reaches main.
      - name: Build the Sandbox images
        run: .github/build-sandbox-images.sh
      # The Playwright webServer builds the app, serves it under Bun and starts the Runner. Only this step runs in the
      # Playwright image; the job stays on the runner, which has Docker for the steps above. The workspace and the
      # runner's Bun (mounted as bun and bunx) go in, the servers bind the host network, so the e2e ports are the same.
      - name: Run the e2e tests in the Playwright image
        run: |
          docker run --rm --init --ipc=host --network host -e CI \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$(readlink -f "$(command -v bun)"):/usr/local/bin/bun:ro" \
            -v "$(readlink -f "$(command -v bun)"):/usr/local/bin/bunx:ro" \
            "$PLAYWRIGHT_IMAGE" bun run test:e2e

  sandbox:
    runs-on: ubuntu-24.04
    # About 7 minutes with seven Topics, the content check being 3 of them (it runs its cases four at a
    # time, vitest.sandbox.config.ts). 30 leaves room for the Topics still to come.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      # Both Sandbox images are built here under the exact name:tag config.ts uses, so the tests
      # find it locally and never pull from GHCR.
      - name: Build the Sandbox images
        run: .github/build-sandbox-images.sh
      # Real Docker on the runner: the Sandbox tests start containers.
      - run: bun run test:sandbox
      # The content check again, on the content the image ships (the run above checks the fixture).
      - name: Content check on content/
        run: bunx vitest run --config vitest.sandbox.config.ts src/lib/server/runner/content-check.sandbox.test.ts
        env:
          CONTENT_DIR: content

  # The Sandbox image names, read from config.ts (the one place they are listed): a JSON array like
  # ["node","go"] for the matrix of publish-sandbox.
  sandbox-images:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - name: List the Sandbox images in config.ts
        id: names
        run: |
          names="$(grep -o 'ghcr.io/[a-z/-]*sandbox-[a-z]*:[0-9]*' src/lib/server/runner/config.ts | sed 's/^.*sandbox-\([a-z]*\):.*$/\1/' | jq -R . | jq -sc .)"
          echo "names=$names" >> "$GITHUB_OUTPUT"

  # Publishes each Sandbox image to GHCR next to the app image, once per tag number (bumped by hand in
  # config.ts when its Dockerfile.sandbox-<name> changes). Only after the tests passed.
  publish-sandbox:
    if: github.event_name == 'push'
    # Two publish runs never race for the same tag.
    concurrency:
      group: publish-sandbox-${{ matrix.name }}
      cancel-in-progress: false
    needs: [lint, sandbox, sandbox-images]
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.sandbox-images.outputs.names) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the image name:tag from config.ts
        id: image
        run: echo "ref=$(grep -o 'ghcr.io/[a-z/-]*sandbox-${{ matrix.name }}:[0-9]*' src/lib/server/runner/config.ts)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is this tag already published?
        id: exists
        run: .github/published.sh "${{ steps.image.outputs.ref }}" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # The action's default is the moving docker.io/tonistiigi/binfmt:latest, which it runs --privileged here.
          # Pinned by index digest; Dependabot does not bump it. To bump: pick a newer qemu-vX.Y.Z-N tag at
          # https://hub.docker.com/r/tonistiigi/binfmt/tags, read its digest with
          # `docker buildx imagetools inspect docker.io/tonistiigi/binfmt:<tag>`, and change all three pins together
          # (ci.yml publish-sandbox and publish-edge, release.yml publish-release).
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.exists.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.sandbox-${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only: nothing is pushed here. load: true keeps the image for the smoke test.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: beyondleetcode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - name: Check the Playwright image
        run: |
          version="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("node_modules/@playwright/test/package.json", "utf8")).version)')"
          case "$PLAYWRIGHT_IMAGE" in
            *":v$version-"*) echo "Playwright $version matches $PLAYWRIGHT_IMAGE" ;;
            *)
              echo "::error::@playwright/test is $version (bun.lock) but PLAYWRIGHT_IMAGE in .github/workflows/ci.yml is $PLAYWRIGHT_IMAGE. Set it to mcr.microsoft.com/playwright:v$version-noble@sha256:<index digest from 'docker buildx imagetools inspect mcr.microsoft.com/playwright:v$version-noble'>."
              exit 1 ;;
          esac
      # Web, runner and init + compose up, then the browser flow in three Languages. release.yml
      # does not run it: its release-gate waits for this run's result on the commit it releases.
      # smoke.sh ends with `bun run test:smoke` on the host. The shim below sends exactly that command into the
      # Playwright image (host network, so localhost:3000 is the composed stack) and passes every other bun call
      # through, so smoke.sh stays as it is.
      - name: Smoke test
        env:
          SMOKE_BASE_URL: http://localhost:3000
        run: |
          shim="$RUNNER_TEMP/bun-shim"
          mkdir -p "$shim"
          export REAL_BUN="$(readlink -f "$(command -v bun)")"
          cat > "$shim/bun" <<'SHIM'
          #!/usr/bin/env bash
          if [ "$*" = "run test:smoke" ]; then
            exec docker run --rm --init --ipc=host --network host -e CI -e SMOKE_BASE_URL \
              -v "$PWD:$PWD" -w "$PWD" \
              -v "$REAL_BUN:/usr/local/bin/bun:ro" \
              "$PLAYWRIGHT_IMAGE" bun run test:smoke
          fi
          exec "$REAL_BUN" "$@"
          SHIM
          chmod +x "$shim/bun"
          PATH="$shim:$PATH" .github/smoke.sh beyondleetcode:ci

  # Publishes the app image as `edge` (a moving tag, overwritten by design) for amd64 and arm64.
  # Only after every test job, the smoke test included, passed on this commit.
  publish-edge:
    if: github.event_name == 'push'
    needs: [typecheck, lint, unit, build, e2e, sandbox, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: publish-edge
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # The action's default is the moving docker.io/tonistiigi/binfmt:latest, which it runs --privileged here.
          # Pinned by index digest; Dependabot does not bump it. To bump: pick a newer qemu-vX.Y.Z-N tag at
          # https://hub.docker.com/r/tonistiigi/binfmt/tags, read its digest with
          # `docker buildx imagetools inspect docker.io/tonistiigi/binfmt:<tag>`, and change all three pins together
          # (ci.yml publish-sandbox and publish-edge, release.yml publish-release).
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gauranshmathur/beyondleetcode:edge
          build-args: IMAGE_REF=ghcr.io/gauranshmathur/beyondleetcode:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
