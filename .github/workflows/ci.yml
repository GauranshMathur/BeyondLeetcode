name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Test the published-tag check
        run: .github/published.test.sh
      - name: Test the release gate's wait for ci
        run: .github/ci-gate.test.sh

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run test
      # vitest runs under Node; the engine's timeouts must also hold on the pinned Bun (#284).
      - run: bun run test:bun

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Builds run on 1.4.3, not the production 1.2.19: SvelteKit 3's build workers end with process.exit(), which
          # on Bun before 1.3.13 ends the whole build early with exit 0 and no build/. Keep equal to the Dockerfile's
          # BUILD_BUN_VERSION and to the e2e job.
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Fails loudly if a build ever stops early with exit 0 again.
      - run: test -f build/index.js && test -f build/handler.js

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # playwright.config.ts runs `bun run build` here and serves the tests from it, so this job needs the build Bun
          # (see the build job); keep equal to the Dockerfile's BUILD_BUN_VERSION.
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The apt half of this step (the Azure mirror) stalled at 25 kB/s on 2026-10-26 (12 minutes for
      # 19 MB; twice it never finished), while the browser download takes seconds, so caching the browsers
      # would not help. Each attempt gets 4 minutes (normally under one), the step 10, and one retry.
      - name: Install Playwright's Chromium
        timeout-minutes: 10
        run: |
          for attempt in 1 2; do
            if timeout -k 10s 4m bunx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Playwright install attempt $attempt failed or timed out"
            # The stalled apt-get runs as root, out of timeout's reach: stop it so the retry gets the dpkg lock.
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -f /usr/lib/apt/methods/ || true
            sleep 5
          done
          exit 1
      # Run goes through the real Runner (started by the Playwright config), which needs the Sandbox image.
      - run: docker pull python:3.13-slim
      # Built here under the exact name:tag config.ts uses, so the Runner finds it locally and never waits
      # on a pull of a tag that is only published once this change reaches main.
      - name: Build the Sandbox images
        run: .github/build-sandbox-images.sh
      # The Playwright webServer builds the app, serves it under Bun and starts the Runner.
      - run: bun run test:e2e

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      # Both Sandbox images are built here under the exact name:tag config.ts uses, so the tests
      # find it locally and never pull from GHCR.
      - name: Build the Sandbox images
        run: .github/build-sandbox-images.sh
      # Real Docker on the runner: the Sandbox tests start containers.
      - run: bun run test:sandbox
      # The content check again, on the content the image ships (the run above checks the fixture).
      - name: Content check on content/
        run: bunx vitest run --config vitest.sandbox.config.ts src/lib/server/runner/content-check.sandbox.test.ts
        env:
          CONTENT_DIR: content

  # Publishes the TypeScript Sandbox image to GHCR next to the app image, once per tag number
  # (bumped by hand in config.ts when Dockerfile.sandbox-node changes). Only after the tests passed.
  publish-sandbox-node:
    if: github.event_name == 'push'
    # Two publish runs never race for the same tag.
    concurrency:
      group: publish-sandbox-node
      cancel-in-progress: false
    needs: sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the image name:tag from config.ts
        id: image
        run: echo "ref=$(grep -o 'ghcr.io/[a-z/-]*sandbox-node:[0-9]*' src/lib/server/runner/config.ts)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is this tag already published?
        id: exists
        run: .github/published.sh "${{ steps.image.outputs.ref }}" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.sandbox-node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}

  # Publishes the Go Sandbox image to GHCR next to the app image, once per tag number
  # (bumped by hand in config.ts when Dockerfile.sandbox-go changes). Only after the tests passed.
  publish-sandbox-go:
    if: github.event_name == 'push'
    # Two publish runs never race for the same tag.
    concurrency:
      group: publish-sandbox-go
      cancel-in-progress: false
    needs: sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the image name:tag from config.ts
        id: image
        run: echo "ref=$(grep -o 'ghcr.io/[a-z/-]*sandbox-go:[0-9]*' src/lib/server/runner/config.ts)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is this tag already published?
        id: exists
        run: .github/published.sh "${{ steps.image.outputs.ref }}" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.sandbox-go
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only: nothing is pushed here. load: true keeps the image for the smoke test.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: beyondleetcode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      # The apt half of this step (the Azure mirror) stalled at 25 kB/s on 2026-10-26 (12 minutes for
      # 19 MB; twice it never finished), while the browser download takes seconds, so caching the browsers
      # would not help. Each attempt gets 4 minutes (normally under one), the step 10, and one retry.
      - name: Install Playwright's Chromium
        timeout-minutes: 10
        run: |
          for attempt in 1 2; do
            if timeout -k 10s 4m bunx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Playwright install attempt $attempt failed or timed out"
            # The stalled apt-get runs as root, out of timeout's reach: stop it so the retry gets the dpkg lock.
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -f /usr/lib/apt/methods/ || true
            sleep 5
          done
          exit 1
      # Web, runner and init + compose up, then the browser flow in three Languages. Shared with
      # release.yml, so the image published there passes the very same test.
      - name: Smoke test
        run: .github/smoke.sh beyondleetcode:ci

  # Publishes the app image as `edge` (a moving tag, overwritten by design) for amd64 and arm64.
  # Only after every test job, the smoke test included, passed on this commit.
  publish-edge:
    if: github.event_name == 'push'
    needs: [typecheck, lint, unit, build, e2e, sandbox, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: publish-edge
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gauranshmathur/beyondleetcode:edge
          build-args: IMAGE_REF=ghcr.io/gauranshmathur/beyondleetcode:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
