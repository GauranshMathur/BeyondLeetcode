name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run lint

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Run goes through the real Runner (started by the Playwright config), which needs the Sandbox image.
      - run: docker pull python:3.13-slim
      # Built here under the exact name:tag config.ts uses, so the Runner finds it locally and never waits
      # on a pull of a tag that is only published once this change reaches main.
      - name: Build the Go Sandbox image
        run: docker build -f Dockerfile.sandbox-go -t "$(grep -o 'ghcr.io/[a-z/-]*sandbox-go:[0-9]*' src/lib/server/runner/config.ts)" .
      # The Playwright webServer builds the app, serves it under Bun and starts the Runner.
      - run: bun run test:e2e

  sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      # The TypeScript Sandbox image is built here under the exact name:tag config.ts uses, so the tests
      # find it locally and never pull from GHCR.
      - name: Build the TypeScript Sandbox image
        run: docker build -f Dockerfile.sandbox-node -t "$(grep -o 'ghcr.io/[a-z/-]*sandbox-node:[0-9]*' src/lib/server/runner/config.ts)" .
      - name: Build the Go Sandbox image
        run: docker build -f Dockerfile.sandbox-go -t "$(grep -o 'ghcr.io/[a-z/-]*sandbox-go:[0-9]*' src/lib/server/runner/config.ts)" .
      # Real Docker on the runner: the Sandbox tests start containers.
      - run: bun run test:sandbox

  # Publishes the TypeScript Sandbox image to GHCR next to the app image, once per tag number
  # (bumped by hand in config.ts when Dockerfile.sandbox-node changes). Only after the tests passed.
  publish-sandbox-node:
    if: github.event_name == 'push'
    needs: sandbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the image name:tag from config.ts
        id: image
        run: echo "ref=$(grep -o 'ghcr.io/[a-z/-]*sandbox-node:[0-9]*' src/lib/server/runner/config.ts)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is this tag already published?
        id: exists
        run: |
          if docker buildx imagetools inspect "${{ steps.image.outputs.ref }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.sandbox-node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}

  # Publishes the Go Sandbox image to GHCR next to the app image, once per tag number
  # (bumped by hand in config.ts when Dockerfile.sandbox-go changes). Only after the tests passed.
  publish-sandbox-go:
    if: github.event_name == 'push'
    needs: sandbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the image name:tag from config.ts
        id: image
        run: echo "ref=$(grep -o 'ghcr.io/[a-z/-]*sandbox-go:[0-9]*' src/lib/server/runner/config.ts)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is this tag already published?
        id: exists
        run: |
          if docker buildx imagetools inspect "${{ steps.image.outputs.ref }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.sandbox-go
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only: nothing is pushed (publishing is C9). load: true keeps the image for the smoke test.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: beyondleetcode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test, web role serves the Map
        run: |
          docker volume create bl-data
          docker run -d --name web -p 3000:3000 -e ORIGIN=http://localhost:3000 -e RUNNER_URL=http://runner:8787 -e RUNNER_TOKEN=ci-web-smoke-token-0123456789abcdef-0123456789 -v bl-data:/data beyondleetcode:ci web
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          docker logs web
          exit 1
      # The runner pulls every Sandbox image at start-up; the tags are only published once this reaches main,
      # so both are built here under the exact name:tag config.ts uses and found locally through the socket.
      - name: Build the TypeScript Sandbox image
        run: docker build -f Dockerfile.sandbox-node -t "$(grep -o 'ghcr.io/[a-z/-]*sandbox-node:[0-9]*' src/lib/server/runner/config.ts)" .
      - name: Build the Go Sandbox image
        run: docker build -f Dockerfile.sandbox-go -t "$(grep -o 'ghcr.io/[a-z/-]*sandbox-go:[0-9]*' src/lib/server/runner/config.ts)" .
      - name: Smoke test, runner role answers its health check
        run: |
          token=$(openssl rand -hex 24)
          docker run -d --name runner -p 8787:8787 -e RUNNER_TOKEN="$token" -v /var/run/docker.sock:/var/run/docker.sock beyondleetcode:ci runner
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://localhost:8787/health || true)
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          docker logs runner
          exit 1
      - name: Smoke test, init then compose up serves the Map
        run: |
          docker rm -f web runner >/dev/null 2>&1 || true
          docker volume rm bl-data >/dev/null 2>&1 || true
          mkdir "$RUNNER_TEMP/instance" && cd "$RUNNER_TEMP/instance"
          docker run --rm -v "$PWD":/out -e BEYONDLEETCODE_IMAGE=beyondleetcode:ci beyondleetcode:ci init --origin http://localhost:3000
          grep -q '^BEYONDLEETCODE_IMAGE=beyondleetcode:ci$' .env
          docker compose up -d
          ok=
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = 200 ] && ok=1 && break
            sleep 2
          done
          if [ -z "$ok" ]; then docker compose logs; docker compose down -v; exit 1; fi
          # Only the runner holds the engine socket.
          if docker compose exec -T web test -e /var/run/docker.sock; then
            echo "web container has the Docker socket"; docker compose down -v; exit 1
          fi
          docker compose exec -T runner test -S /var/run/docker.sock
      # The stack stays up for the browser smoke test below.
      - name: Wait for the runner to be ready
        working-directory: ${{ runner.temp }}/instance
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T runner bun -e 'const r = await fetch("http://127.0.0.1:8787/health", { headers: { Authorization: `Bearer ${process.env.RUNNER_TOKEN}` } }); process.exit(r.status === 200 ? 0 : 1)'; then exit 0; fi
            sleep 2
          done
          echo "runner never became ready"
          exit 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Seam 4: Map, Topic, Chapter, Problem, Run, Submit, Accepted, once per Language, on the composed image.
      - name: Smoke test, the browser flow on the composed stack
        env:
          SMOKE_BASE_URL: http://localhost:3000
        run: bun run test:smoke
      - name: Dump compose logs
        if: failure()
        working-directory: ${{ runner.temp }}/instance
        run: docker compose logs
      - name: Stop the stack
        if: always()
        working-directory: ${{ runner.temp }}/instance
        run: docker compose down -v

  # Publishes the app image as `edge` (a moving tag, overwritten by design) for amd64 and arm64.
  # Only after every test job, the smoke test included, passed on this commit.
  publish-edge:
    if: github.event_name == 'push'
    needs: [typecheck, lint, unit, build, sandbox, docker]
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-edge
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gauranshmathur/beyondleetcode:edge
          build-args: IMAGE_REF=ghcr.io/gauranshmathur/beyondleetcode:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
