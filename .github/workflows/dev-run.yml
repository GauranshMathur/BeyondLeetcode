# An on-demand run of dev mode against the real Runner and the real content/ folder, following the self-hosting
# guide's "From a clone" and then "In the published image" (the image pulled with no login) on a GitHub-hosted
# runner and driving the screens with a Playwright walk. It records every step (passed, failed or not reached),
# the timings and twelve screenshots of each route in the `dev-run` artifact.
#
# It is not part of `ci` or its `tests` job, and it is not a required check: a red run is a finding about dev mode
# or the guide, not a reason to hold a merge.
# It also runs on a pull request that changes one of its own four files (the workflow, the script, the walk and the
# Playwright config), so a change to the run proves itself on its own pull request, and on no other pull request.
# It never runs on the maintainer's host: the script starts a server, the Runner and Docker containers and edits
# content/ in its checkout.
#
# To start it once this file is on main: gh workflow run dev-run.yml --ref <branch>
name: dev-run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dev-run.yml
      - .github/dev-run.sh
      - playwright.dev-run.config.ts
      - src/routes/dev-run.walk.ts

permissions:
  contents: read

concurrency:
  group: dev-run-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Playwright image of ci.yml's PLAYWRIGHT_IMAGE: the two move together (version and digest).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea

jobs:
  dev-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The guide: "Bun 1.3.13 or later (CI builds with 1.4.3)".
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Check the Playwright image
        run: |
          version="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("node_modules/@playwright/test/package.json", "utf8")).version)')"
          case "$PLAYWRIGHT_IMAGE" in
            *":v$version-"*) echo "Playwright $version matches $PLAYWRIGHT_IMAGE" ;;
            *)
              echo "::error::@playwright/test is $version (bun.lock) but PLAYWRIGHT_IMAGE in .github/workflows/dev-run.yml is $PLAYWRIGHT_IMAGE. Set it to mcr.microsoft.com/playwright:v$version-noble@sha256:<index digest from 'docker buildx imagetools inspect mcr.microsoft.com/playwright:v$version-noble'>, as ci.yml has it."
              exit 1 ;;
          esac
          # The whole reference, tag and digest, equals ci.yml's: a different digest under the same version fails.
          mapfile -t ci_refs < <(sed -n 's/^  PLAYWRIGHT_IMAGE: //p' .github/workflows/ci.yml)
          if [ "${#ci_refs[@]}" -ne 1 ] || [ "${ci_refs[0]}" != "$PLAYWRIGHT_IMAGE" ]; then
            echo "::error::PLAYWRIGHT_IMAGE in .github/workflows/dev-run.yml ($PLAYWRIGHT_IMAGE) differs from the one in .github/workflows/ci.yml (${ci_refs[*]:-none}). Copy ci.yml's line, tag and digest, here."
            exit 1
          fi
      - name: Follow "From a clone" and "In the published image"
        id: dev-run
        run: .github/dev-run.sh "$RUNNER_TEMP/dev-run"
      # Only a record the script has cleaned of the secrets it knows (the clone's Runner token, and the Runner token and
# auth secret that init writes): it writes record=clean after the last check, so a
      # failed walk still uploads its record, and every other path uploads nothing.
      - name: Upload the record
        if: always() && steps.dev-run.outputs.record == 'clean'
        uses: actions/upload-artifact@v7
        with:
          name: dev-run
          path: ${{ runner.temp }}/dev-run
          retention-days: 90
          if-no-files-found: warn
