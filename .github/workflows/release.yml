name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Runs merge and tag releases, so two at once could race on the same release
# PR. Queue them instead, and never cancel one partway through a release.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      # Either release-please run can create the release (the first one, when it recovers a release
      # PR merged earlier), so take whichever did.
      release_created: ${{ steps.tag.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.tag.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      # Accumulates conventional commits into a release PR. Merging that PR tags
      # the release and writes CHANGELOG.md.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Every releasable commit (feat, fix) ships its own release. Find the
      # release PR: the one release-please just opened or refreshed, else one
      # already open and unchanged (release-please leaves `pr` empty then, as
      # after a failed merge or a docs or ci commit). Empty when none is open.
      - name: Find the release PR
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          if [ -n "$RELEASE_PR" ]; then
            number="$(jq -r '.number' <<<"$RELEASE_PR")"
          else
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --label "autorelease: pending" --json number --jq '.[0].number // empty')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Merge it, so a release PR left open by a failed merge is retried on the
      # next push. Step env is evaluated even when `if` skips the step, so the
      # number comes from an output, not fromJSON on an empty `pr`.
      - name: Merge the release PR
        if: ${{ steps.find.outputs.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.find.outputs.number }}
        run: gh pr merge "$RELEASE_PR_NUMBER" --squash --repo "$GITHUB_REPOSITORY"

      # A merge made with GITHUB_TOKEN does not trigger this workflow again, so
      # run release-please once more to tag and publish what was just merged.
      # If this misses it, the next push to main releases it instead, since
      # release-please picks up any merged PR still labelled autorelease: pending.
      - name: Tag and publish the release
        id: tag
        if: ${{ steps.find.outputs.number }}
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release gate. A tag created with GITHUB_TOKEN triggers no workflow, so release publishing
  # runs here, in the release run. This job holds no write permission and builds nothing: it ties
  # the tag to the commit ci tested and waits for that ci run (smoke test, sandbox tests and all).
  release-gate:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      # Resolve the tag once. Every check below, and the publish job, use this sha, never the
      # tag name again, so a tag moved after the checks cannot change what is published.
      - name: Resolve the tag to a commit
        id: resolve
        run: echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
      # The release PR commit only bumps versions and the changelog. Anything else differing from
      # the tested commit means the release is not what ci tested.
      - name: The release differs from the tested commit only in the version
        env:
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "$RELEASE_SHA" || {
            echo "$GITHUB_SHA is not an ancestor of $RELEASE_SHA ($TAG)"; exit 1
          }
          changed="$(git diff --name-only "$GITHUB_SHA" "$RELEASE_SHA")"
          echo "Files changed between $GITHUB_SHA and $RELEASE_SHA ($TAG):"
          echo "$changed"
          other="$(grep -vxE 'CHANGELOG\.md|\.release-please-manifest\.json|package\.json' <<<"$changed" || true)"
          if [ -n "$other" ]; then
            echo "Not release-please files:"; echo "$other"; exit 1
          fi
          # package.json is executable content: only its version may differ.
          tested="$(git show "$GITHUB_SHA:package.json" | jq -S 'del(.version)')"
          released="$(git show "$RELEASE_SHA:package.json" | jq -S 'del(.version)')"
          [ "$tested" = "$released" ] || { echo "package.json differs beyond .version"; exit 1; }
      - name: Wait for ci to pass on the tested commit
        run: |
          # ci starts on the same push as this run, so give it a few minutes to appear.
          id=
          for i in $(seq 1 30); do
            id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "No ci run found for $GITHUB_SHA"; exit 1; }
          # Bounded: gives up after 40 minutes (a normal run takes well under 15).
          timeout 2400 gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status

  # Publishes the app image as vX.Y.Z and latest, once the gate passed. The only job here with a
  # write permission. It runs no repo script and no test; the only repo content it executes is
  # the Dockerfile build.
  publish-release:
    needs: [release-please, release-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/gauranshmathur/beyondleetcode
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-gate.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A published version tag is never overwritten. Same exact-match logic as .github/published.sh
      # in PR #80: only the registry's definite answer about this ref means "not published"; any
      # other error fails the job. Output naming a digest is never "not published".
      - name: Is this version tag already published?
        id: exists
        run: |
          ref="$IMAGE:$TAG"
          if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [[ "$output" != *@sha256:* ]] &&
            { grep -qxF "ERROR: $ref: not found" <<<"$output" || grep -qiF 'manifest unknown' <<<"$output"; }; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not tell whether $ref is published:"
            echo "$output"
            exit 1
          fi
      - if: steps.exists.outputs.published == 'true'
        run: echo "::notice::$IMAGE:$TAG is already published, not overwriting it or moving latest"
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.exists.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          build-args: IMAGE_REF=${{ env.IMAGE }}:${{ env.TAG }}
