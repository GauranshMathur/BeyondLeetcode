name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Runs open the release PR and tag releases, so two at once could race on the same release
# PR. Queue them instead, and never cancel one partway through a release.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Accumulates conventional commits into a release PR and keeps it fresh. Nothing merges it:
      # the orchestrator cuts each release by merging the PR by hand (docs/releasing.md). That
      # push runs this step again, which tags the release and writes CHANGELOG.md.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Opened with RELEASE_PAT, not the built-in token: workflows do not run on PRs the
          # built-in token creates, and the main ruleset requires those checks.
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release gate. A tag created with GITHUB_TOKEN triggers no workflow, so release publishing
  # runs here, in the release run. This job holds no write permission and builds nothing: it ties
  # the tag to the commit ci tested and waits for that ci run's test jobs (smoke test, sandbox tests and all).
  release-gate:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      # Resolve the tag once. Every check below, and the publish job, use this sha, never the
      # tag name again, so a tag moved after the checks cannot change what is published.
      - name: Resolve the tag to a commit
        id: resolve
        run: echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
      # The release PR commit only bumps versions and the changelog. Anything else differing from
      # the tested commit means the release is not what ci tested.
      - name: The release differs from the tested commit only in the version
        env:
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "$RELEASE_SHA" || {
            echo "$GITHUB_SHA is not an ancestor of $RELEASE_SHA ($TAG)"; exit 1
          }
          changed="$(git diff --name-only "$GITHUB_SHA" "$RELEASE_SHA")"
          echo "Files changed between $GITHUB_SHA and $RELEASE_SHA ($TAG):"
          echo "$changed"
          other="$(grep -vxE 'CHANGELOG\.md|\.release-please-manifest\.json|package\.json' <<<"$changed" || true)"
          if [ -n "$other" ]; then
            echo "Not release-please files:"; echo "$other"; exit 1
          fi
          # package.json is executable content: only its version may differ.
          tested="$(git show "$GITHUB_SHA:package.json" | jq -S 'del(.version)')"
          released="$(git show "$RELEASE_SHA:package.json" | jq -S 'del(.version)')"
          [ "$tested" = "$released" ] || { echo "package.json differs beyond .version"; exit 1; }
      # Gates on ci's test jobs, not the run's conclusion: publish-edge can be cancelled by a newer
      # push while pending, which ends the run `cancelled` though every test passed. The script
      # (from the tag, which the check above tied to the tested commit) waits up to 40 minutes.
      - name: Wait for ci's test jobs to pass on the tested commit
        run: .github/ci-gate.sh "$GITHUB_SHA"

  # Publishes the app image as vX.Y.Z and latest, once the gate passed. The only job here with a
  # write permission. It runs no test; the only repo content it executes is .github/published.sh (from the gated sha) and
  # the Dockerfile build.
  publish-release:
    needs: [release-please, release-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/gauranshmathur/beyondleetcode
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-gate.outputs.sha }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A published version tag is never overwritten; the check is .github/published.sh.
      - name: Is this version tag already published?
        id: exists
        run: .github/published.sh "$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.published == 'true'
        run: echo "::notice::$IMAGE:$TAG is already published, not overwriting it or moving latest"
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.exists.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          build-args: IMAGE_REF=${{ env.IMAGE }}:${{ env.TAG }}

      # Pings the maintainer's Hermes instance over Tailscale the moment this image
      # actually publishes — a real event hook, not a poller. The runner joins the
      # tailnet just for this one step (ephemeral node, torn down when the job ends)
      # and never touches anything else on the tailnet.
      - name: Join tailnet to notify the release webhook
        if: steps.exists.outputs.published != 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ""
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci
      - name: Notify release webhook
        if: steps.exists.outputs.published != 'true'
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          PAYLOAD=$(jq -n --arg tag "$TAG" --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG" \
            '{action:"released", release:{tag_name:$tag, name:$tag, html_url:$url}}')
          SIG="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
          curl -sf -X POST "http://100.103.185.100:8644/webhooks/beyondleetcode-release" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -H "X-Hub-Signature-256: $SIG" \
            --data-binary "$PAYLOAD" || echo "::warning::Release webhook notify failed (non-fatal)"
